name: Wake Antina

on:
  issues:
    types: [labeled]

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: antina-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  antina:
    if: >-
      github.event.issue.author_association == 'OWNER' &&
      (github.event.label.name == 'to:antina' ||
       github.event.label.name == 'state:ready' ||
       github.event.label.name == 'state:revision')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install Antigravity runtime
        run: python -m pip install --requirement requirements-antina.txt
      - name: Validate event and run isolated Antina task
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/antina_runner.py --event "$GITHUB_EVENT_PATH" --workspace "$GITHUB_WORKSPACE"
