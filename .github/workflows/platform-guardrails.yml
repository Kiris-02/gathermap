name: Platform guardrails

on:
  push:
    branches:
      - chore/agent-orchestrator-v1
      - feat/platform-antina-runner-v1
      - feat/platform-existing-pr-revision-v1
      - feat/local-antina-worker
    paths:
      - scripts/agent_cycle.py
      - scripts/antina_runner.py
      - scripts/local_antina_worker.py
      - tests/test_agent_cycle.py
      - tests/test_antina_runner.py
      - tests/test_local_antina_worker.py
      - requirements-antina.txt
      - .github/workflows/antina-runner.yml
      - .github/workflows/antina-validation.yml
      - .github/workflows/platform-guardrails.yml
      - docs/bridge-review/**
  pull_request:
    paths:
      - scripts/agent_cycle.py
      - scripts/antina_runner.py
      - scripts/local_antina_worker.py
      - tests/test_agent_cycle.py
      - tests/test_antina_runner.py
      - tests/test_local_antina_worker.py
      - requirements-antina.txt
      - .github/workflows/antina-runner.yml
      - .github/workflows/antina-validation.yml
      - .github/workflows/platform-guardrails.yml
      - docs/bridge-review/**

permissions:
  contents: read

jobs:
  offline-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run guarded handoff tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run bridge regression tests
        run: |
          if [ -f docs/bridge-review/gat-ops-009/test_bridge.py ]; then
            python -m unittest -v docs/bridge-review/gat-ops-009/test_bridge.py
          fi
